[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crabgraph-agent"
version = "0.2.0"
description = "Multimodal mud-crab knowledge assistant with DeepSeek and migrated LightRAG"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "streamlit>=1.40,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "pillow>=11,<13", "ijson>=3.4,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "python-multipart>=0.0.20", "mcp>=1.20,<2", "reportlab>=4,<5", "mangum>=0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = ["vendor", "research", ".venv", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
